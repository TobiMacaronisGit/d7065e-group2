# GENERATED by scripts/gen_compose.py from config/rooms.json — do not edit by hand.
# One container per physical device (design decision D-05, docs/decision-log.md).
services:
  sensor-co2-a109:
    image: d7065e/sensor
    build: {context: ., dockerfile: sensor/Dockerfile}
    environment:
      SENSOR_ID: "A109-co2"
      ROOM: "A109"
      LEVEL: "level0"
      TYPE: "co2"
      UNIT: "ppm"
      SAMPLE_S: "2"
      NOISE_SIGMA: "15.0"
      LAG_S: "30"
      PHYSICS_URL: "http://physics:8000"
      BUILDSIM_URL: "${BUILDSIM_URL:-http://buildsim:9090}"
      MQTT_HOST: "broker"
    depends_on:
      broker: {condition: service_healthy}
      physics: {condition: service_healthy}
    restart: unless-stopped
    labels: {d7065e.layer: device, d7065e.room: A109, d7065e.type: co2}
  sensor-temp-a109:
    image: d7065e/sensor
    build: {context: ., dockerfile: sensor/Dockerfile}
