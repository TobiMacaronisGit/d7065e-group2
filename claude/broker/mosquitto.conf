# Mosquitto for the lab. Anonymous, loopback-published only (docker-compose.yml binds 127.0.0.1).
# persistence = retained messages (last command per actuator, last plan per room, health) and
# queued QoS-1 messages for offline persistent sessions (clean_session=false in common/mqtt.py)
# survive a broker restart → a restarted consumer gets what it missed.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
max_queued_messages 10000
log_dest stdout
log_type error
log_type warning
log_type notice
